name: conformidade

# Kit de agentes de LeoKuli/agentes-padroes: qualquer modelo retoma o projeto só com o repositório.
# Reprova sem AGENTS.md, com docs/ESTADO.md vencido, sem ADR ou com PREENCHER sobrando; roda o gitleaks no PR
# e o comando único (o conferidor das páginas e o controle dele).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformidade:
    uses: LeoKuli/agentes-padroes/.github/workflows/conformidade.yml@main
    with:
      dias-maximos: 30
  segredos:
    if: github.event_name == 'pull_request'
    uses: LeoKuli/agentes-padroes/.github/workflows/segredos.yml@main
  verificar:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Comando único
        run: bash scripts/verificar
